<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 Startups Profit Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2, #6dd5ed);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .main-container {
            width: 100%;
            max-width: 850px;
        }

        .card-box {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .title {
            text-align: center;
            color: #4a148c;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-control,
        .form-select {
            height: 50px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .btn-predict {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-predict:hover {
            transform: scale(1.03);
        }

        .result-box {
            margin-top: 25px;
            background: #f4f7ff;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .result-box h3 {
            color: #28a745;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .footer h4 {
            color: #4a148c;
            font-weight: 700;
        }

        .footer p {
            color: #666;
            margin-bottom: 5px;
        }

        .project-badge {
            background: #764ba2;
            color: white;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="main-container">

        <div class="card-box">

            <div class="text-center">
                <span class="project-badge">Machine Learning Project</span>
            </div>

            <h1 class="title">50 Startups Profit Prediction</h1>
            <p class="subtitle">
                Predict Startup Profit using Multiple Linear Regression
            </p>

            <form action="/predict" method="POST">

                <input type="number" step="any" class="form-control"
                    name="R&D" placeholder="Enter R&D Spend" required>

                <input type="number" step="any" class="form-control"
                    name="Administration" placeholder="Enter Administration Cost" required>

                <input type="number" step="any" class="form-control"
                    name="Marketing Spend" placeholder="Enter Marketing Spend" required>

                <select class="form-select" name="State" required>
                    <option value="">Select State</option>
                    <option value="0">California</option>
                    <option value="1">Florida</option>
                    <option value="2">New York</option>
                </select>

                <button type="submit" class="btn-predict">
                    Predict Profit
                </button>

            </form>

            <div class="result-box">
                <h3>Predicted Profit</h3>
                <h4>{{ prediction_text }}</h4>
            </div>

            <div class="footer">
                <h4>Durshanam Samyuktha</h4>
                <p>Data Analyst | Machine Learning Engineer | Python Developer</p>
                <p>Email: durshanamsamyuktha@gmail.com</p>
                <p>Phone: +91 9347597314</p>
            </div>

        </div>

    </div>

</body>

</html>
